<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#fff7dc" />
    <title>大羊神・光彩舞台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="audience-page">
    <main class="stage-shell" aria-label="大羊神互動舞台">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <canvas id="scene" aria-label="可互動的大羊神 3D 公仔"></canvas>

      <header class="audience-header">
        <div class="brand-mark" aria-hidden="true">骨</div>
        <div>
          <p class="eyebrow">MAGICAL GOAT PARADE</p>
          <h1>大羊神<br /><span>光彩舞台</span></h1>

      <div class="color-readout" aria-live="polite">
        <span class="status-dot"></span>
        <span id="color-label">原始彩繪</span>

      <button class="tap-hint" id="tap-hint" type="button">

        <span><strong>點點大羊神</strong><small>讓祂閃閃發亮</small></span>

        <span>互動式 3D 公仔</span>
        <span aria-hidden="true">◌</span>
        <span>Three.js</span>
      </footer>

      <div class="loading-screen" id="loading-screen">
        <div class="loading-goat">♑</div>
        <p>大羊神登場中⋯</p>
      </div>
    </main>
    <script type="module" src="./audience.js?v=20260801-3"></script>
